<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="./css/login-page.css">
</head>
<body>
    <main>
        <section>
            <h1>Login</h1>
        </section>

        <section>
            <form>
                <div>
                    <input type="email" name="email" id="fldEmail" placeholder="E-mail">
                </div>
                <div>
                    <input type="password" name="password" id="fldPassword" placeholder="Password">
                </div>
                <div>
                    <button>Sign In</button>
                </div>
            </form>
        </section>

        <section>
            <a href="#" target="_blank" class="text-gray">Lost your password?</a>
        </section>
    </main>

    <footer>
        <p>Don't have an account? <a class="text-white" href="#" target="_blank">Sign up here!</a></p>
    </footer>
</body>
</html>
