<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Tailwind Form</title>
</head>
<body>

    <!-- Header -->
    <header>
        <nav>
            <div>
                <p>Πεδία Αίτησης</p>
            </div>

            <div>
                <p>Ακαδημαϊκά Προσόντα</p>
            </div>

            <div>
                <p>Διδακτική και Εργασιακή Εμπειρία</p>
            </div>
        </nav>
    </header>

    <!-- Main -->
    <main>
        <div>
            <div>
                <p>Προσωπικά Στοιχεία</p>
            </div>

            <!-- Form -->
            <form>
                <div>
                    <!-- ΑΦΜ, Όνομα, Επώνυμο -->
                    <div>
                        <div>
                            <label>ΑΦΜ:</label>
                            <input type="text" name="afm">

                            <label>Όνομα:</label>
                            <input type="text" name="firstname">

                            <label>Επώνυμο:</label>
                            <input type="text" name="lastname">
                        </div>

                        <div>
                            <label>Όνομα Πατρός:</label>
                            <input type="text" name="fatherName">

                            <label>Όνομα Μητρός:</label>
                            <input type="text" name="motherName">

                            <label>Ημερομηνία Γέννησης*:</label>
                            <input type="date" name="date">
                        </div>
                    </div>

                    <!-- Φύλο -->
                    <div>
                        <label>Φύλο*:</label>
                        <select name="gender" id="gender">
                            <option value="genderM">Άρρεν</option>
                            <option value="genderF">Θήλυ</option>
                        </select>
                    </div>

                    <!-- ΑΜΚΑ, Ταυτότηα -->
                    <div>
                        <div>
                            <div>
                                <label>ΑΜΚΑ*:
                                    <span>
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />
                                        </svg>
                                    </span>
                                </label>
                            </div>

                            <div>
                                <button>
                                    <span>
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                                        </svg>
                                    </span>Προβολή
                                </button>
                            </div>

                            <div>
                                <input type="text" name="amka" placeholder="ΑΜΚΑ.pdf">
                                    <span>
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                                        </svg>
                                    </span>
                            </div>
                        </div>

                        <div>
                            <div>
                            <label>Αριθμός Δελτίου Ταυτότητας ή Διαβατηρίου*:
                                <span>
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />
                                    </svg>
                                </span>
                            </label>
                        </div>

                        <div>
                            <button>
                                <span>
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                                        </svg>
                                </span>Προβολή
                            </button>

                            <div>
                                <input type="text" name="id" placeholder="ΤΑΥΤΟΤΗΤΑ.pdf">
                                    <span>
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                                        </svg>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Στρατιωτική Θητεία -->
                    <div>
                        <div>
                            <label>Εκπλήρωση Στρατιωτικών Υποχρεώσεων ή Νόμιμη Απαλλαγή από αυτές:
                                <span>
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />
                                    </svg>
                                </span>
                            </label>

                            <select name="yon" id="yon">
                                <option value="yes">ΝΑΙ</option>
                                <option value="no">ΟΧΙ</option>                               
                            </select>
                        </div>

                        <div>
                            <button>
                                <span>
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                                        </svg>
                                </span>Προβολή
                            </button>

                            <div>
                                <input type="text" name="military" placeholder="ΣΤΡΑΤΟΛΟΓΙΚΗ ΚΑΤΑΣΤΑΣΗ.pdf">
                                <span>
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                                    </svg>
                                </span>
                            </div>
                        </div>
                    </div>

                    <!-- Ομογένεια, Επισύναψη -->
                    <div>
                        <div>
                            <label>Είστε πολίτης κράτους της ΕΕ ή Βορειοηπειρώτης ή Κύπριος Ομογενής ή Ομογενής Αλλοδαπός
                                εξ Αιγύπτου, Κωνσταντινούπολης, Ίμβρου, Τενέδου;</label>

                            <select name="yon" id="yon">
                                <option value="no">ΟΧΙ</option>
                                <option value="yes">ΝΑΙ</option>                            
                            </select>
                        </div>

                        <div>
                            <button>
                                <span>
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" />
                                    </svg>
                                </span>Επισύναψη
                            </button>

                            <div>
                                <input type="text" name="fileName" placeholder="Όνομα αρχείου.pdf">
                                
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
