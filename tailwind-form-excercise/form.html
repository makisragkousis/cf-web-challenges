<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Tailwind Form</title>
</head>
<body>
    <div class="border w-[99%] h-[99%] mx-auto mt-2 mb-2 min-h-screen">
        <!-- Header -->
        <header class="border-b border-gray-200 pb-2">
            <nav class="flex space-x-4 px-4 mt-2 mx-1 bg-white">
                <div class="border-b-2 border-blue-500 text-blue-500 cursor-pointer">
                    <p>Πεδία Αίτησης</p>
                </div>

                <div class="text-gray-700 cursor-pointer">
                    <p>Ακαδημαϊκά Προσόντα</p>
                </div>

                <div class="text-gray-700 cursor-pointer">
                    <p>Διδακτική και Εργασιακή Εμπειρία</p>
                </div>
            </nav>
        </header>

        <!-- Main -->
        <main>
            <div class="absolute left-5 t-0 text-gray-700 bg-white text-sm mt-1 px-1 rounded z-50">
                    <p>Προσωπικά Στοιχεία</p>
            </div>

            <div class="relative px-5 py-3 border-t-12 border-blue-500 rounded-t mt-2">
            
                <!-- Form -->
                <form>
                    <div class="mt-10">
                        <div>
                            <!-- ΑΦΜ, Όνομα, Επώνυμο -->
                            <div class="grid grid-cols-2 md:grid-cols-6 gap-4 w-full border-b border-gray-200 py-3 items-center">
                                <label>ΑΦΜ:</label>
                                <input class="bg-gray-100 rounded w-full border border-gray-200 p-1" type="text" name="afm">

                                <label>Όνομα:</label>
                                <input class="bg-gray-100 rounded w-full border border-gray-200 p-1" name="firstname">

                                <label>Επώνυμο:</label>
                                <input class="bg-gray-100 rounded w-full border border-gray-200 p-1" name="lastname">
                            </div>

                            <!-- Όνομα Πατρός/Μητρός, Η/Γ -->
                            <div class="grid grid-cols-2 md:grid-cols-6 gap-4 w-full border-b border-gray-200 py-3 items-center">
                                <label>Όνομα Πατρός:</label>
                                <input class="bg-gray-100 rounded w-full border border-gray-200 p-1" name="fatherName">

                                <label>Όνομα Μητρός:</label>
                                <input class="bg-gray-100 rounded w-full border border-gray-200 p-1" type="text" name="motherName">

                                <label>Ημερομηνία Γέννησης*:</label>
                                <div class="flex items-center group">
                                    <input class="border border-gray-200 rounded-l w-[60%] ms-4 p-1" type="text" name="date">
                                    <span class="border border-gray-200 border-l-0 rounded-r p-1">
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5m-9-6h.008v.008H12v-.008ZM12 15h.008v.008H12V15Zm0 2.25h.008v.008H12v-.008ZM9.75 15h.008v.008H9.75V15Zm0 2.25h.008v.008H9.75v-.008ZM7.5 15h.008v.008H7.5V15Zm0 2.25h.008v.008H7.5v-.008Zm6.75-4.5h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V15Zm0 2.25h.008v.008h-.008v-.008Zm2.25-4.5h.008v.008H16.5v-.008Zm0 2.25h.008v.008H16.5V15Z" />
                                        </svg>
                                    </span>
                                </div>
                            </div>
                        </div>

                        <!-- Φύλο -->
                        <div class="flex justify-start space-x-60 mt-2 py-4 border-b border-gray-200">
                            <label>Φύλο*:</label>
                            <select class="p-1" name="gender" id="gender">
                                <option value="genderM">Άρρεν</option>
                                <option value="genderF">Θήλυ</option>
                            </select>
                        </div>

                        <!-- ΑΜΚΑ, Ταυτότηα -->
                        <div class="mt-4">
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 w-full border-b border-gray-200 py-3 items-center">
                                <div class="flex items-center">
                                    <label>ΑΜΚΑ*:</label>
                                    <span>
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />
                                        </svg>
                                    </span>
                                </div>

                                <div>
                                    <input class="border border-gray-200 rounded p-1" type="text" name="amka">
                                </div>

                                <div class="flex items-center">
                                    <div>                                        
                                        <button class="bg-blue-500 rounded text-white px-3 py-1 flex items-center gap-1 hover:bg-blue-700 cursor-pointer">
                                            <span>
                                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                                                </svg>
                                            </span>
                                        Προβολή</button>
                                    </div>

                                    <div class="flex items-center">
                                        <input class="border bg-gray-200 p-1 rounded font-semibold w-full" type="text" name="amka" placeholder="ΑΜΚΑ.pdf">
                                        <span class="border border-red-500 text-red-500 px-2 py-1 hover:bg-red-500 hover:border-white-500 hover:text-white cursor-pointer">
                                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                                            </svg>
                                        </span>
                                    </div>
                                </div>
                            </div>

                            <div class="mt-4">
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 w-full border-b border-gray-200 py-3 items-center">
                                <div class="flex items-center">
                                    <label>Αρ. Δελτίου Ταυτότητας ή Διαβατηρίου*:</label>
                                    <span>
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />
                                        </svg>
                                    </span>
                                </div>

                                <div>
                                    <input class="border border-gray-200 rounded p-1" type="text" name="amka">
                                </div>

                                <div class="flex items-center">
                                    <div>                                        
                                        <button class="bg-blue-500 rounded text-white px-3 py-1 flex items-center gap-1 hover:bg-blue-700 cursor-pointer">
                                            <span>
                                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                                                </svg>
                                            </span>
                                        Προβολή</button>
                                    </div>

                                    <div class="flex items-center">
                                        <input class="border bg-gray-200 p-1 rounded font-semibold w-full" type="text" name="amka" placeholder="ΤΑΥΤΟΤΗΤΑ.pdf">
                                        <span class="border border-red-500 text-red-500 px-2 py-1 hover:bg-red-500 hover:border-white-500 hover:text-white cursor-pointer">
                                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                                            </svg>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Στρατιωτική Θητεία -->
                        <div class="mt-4">
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 w-full border-b border-gray-200 py-3 items-center">
                                <div class="flex items-center">
                                    <label>Εκπλήρωση Στρατιωτικών Υποχρεώσεων ή Νόμιμη Απαλλαγή από αυτές</label>
                                    <span>
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />
                                        </svg>
                                    </span>
                                </div>

                                <div>
                                    <select class="p-1" name="yon" id="yon">
                                        <option value="yes">ΝΑΙ</option>
                                        <option value="no">ΟΧΙ</option>                               
                                    </select>
                                </div>

                                <div class="flex items-center">
                                    <div>                                        
                                        <button class="bg-blue-500 rounded text-white px-3 py-1 flex items-center gap-1 hover:bg-blue-700 cursor-pointer">
                                            <span>
                                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                                                </svg>
                                            </span>
                                        Προβολή</button>
                                    </div>

                                    <div class="flex items-center">
                                        <input class="border bg-gray-200 p-1 rounded font-semibold w-full" type="text" name="amka" placeholder="ΣΤΡΑΤΟΛΟΓΙΚΗ ΚΑΤΑΣΤΑΣΗ.pdf">
                                        <span class="border border-red-500 text-red-500 px-2 py-1 hover:bg-red-500 hover:border-white-500 hover:text-white cursor-pointer">
                                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                                            </svg>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Ομογένεια, Επισύναψη -->
                        <div class="mt-4">
                            <div class="grid grid-cols-1 md:grid-cols-2 w-full py-3 items-center gap-123">
                                <div class="flex flex-col">
                                    <label>Είστε πολίτης κράτους της ΕΕ ή Βορειοηπειρώτης ή Κύπριος Ομογενής ή Ομογενής Αλλοδαπός
                                        εξ Αιγύπτου, Κωνσταντινούπολης, Ίμβρου, Τενέδου;</label>

                                    <select class="w-[10%] p-1" name="yon" id="yon">
                                        <option value="no">ΟΧΙ</option>
                                        <option value="yes">ΝΑΙ</option>                            
                                    </select>
                                </div>

                                <div class="flex items-center">
                                    <div>
                                        <button class="bg-green-700/50 rounded text-white px-3 py-1 flex items-center gap-1 hover:bg-green-500 cursor-pointer">
                                            <span>
                                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                                <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" />
                                                </svg>
                                            </span>Επισύναψη
                                        </button>
                                    </div>

                                    <div>
                                        <input class="border border-gray-200 rounded p-1 rounded bg-gray-200 w-full" type="text" name="fileName" placeholder="Όνομα αρχείου.pdf">                                     
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>

</body>
</html>
