<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Αίτηση Συμμετοχής</title>
</head>
<body>
    
    <form>
        <h1>Αίτηση Συμμετοχής</h1>

        <h2>Προσωπικά Στοιχεία</h2>

        <div>
            <label for="fldName">Όνομα:</label>
            <input type="text" name="name" id="fldName">

            <label for="fldLastname">Επώνυμο:</label>
            <input type="text" name="lastname" id="fldLastname">

            <label for="fldFatherName">Πατρώνυμο:</label>
            <input type="text" name="fathername" id="fldFatherName">
        </div>

        <h2>Στοιχεία Κατοικίας</h2>

        <div>
            <label for="fldAddress">Διεύθυνση Κατοικίας:</label>
            <input type="text" name="Address" id="fldAddress">

            <label for="fldAddressNumber">Αριθμός:</label>
            <input type="number" name="addressnumber" id="fldAddressNumber">

            <label for="fldPostcode">ΤΚ:</label>
            <input type="text" name="postcode" id="fldPostcode">
        </div>

        <h2>Στοιχεία Επικοινωνίας</h2>

        <div>
            <label for="fldPhone">Τηλέφωνο:</label>
            <input type="text" name="phone" id="fldPhone">

            <label for="fldPhoneNumber">Αριθμός:</label>
            <input type="tel" name="phonenumber" id="fldPhoneNumber">
        </div>
    </form>
</body>
</html>
