<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Στοιχεία Εκπαιδευόμενου</title>
</head>
<body>

    <h1>Στοιχεία Εκπαιδευόμενου</h1>

    <form>
        <table>
            <tr>
                <td>
                    <label for="fldLastname">Επώνυμο:</label>
                </td>
                <td>
                    <input type="text" name="lastname" id="fldLastname">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="fldFirstname">Όνομα:</label>
                </td>
                <td>
                    <input type="text" name="firstname" id="fldFirstname">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="fldBirthday">Ημερομηνία Γέννησης:</label>
                </td>
                <td>
                    <input type="date" name="birthday" id="fldBirthday">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="fldYear">Έτος Σπουδών:</label>
                </td>
                <td>
                    <input type="number" name="year" id="fldYear">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="fldEmail">Login (e-mail):</label>
                </td>
                <td>
                    <input type="email" name="Email" id="fldEmail">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="fldPassword">Password:</label>
                </td>
                <td>
                    <input type="password" name="Password" id="fldPassword">
                </td>
            </tr>
            <tr>
                <td>
                    <input type="submit" value="Αποστολή">
                </td>
            </tr>
        </table>
    </form>
    
</body>
</html>
