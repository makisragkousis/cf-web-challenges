<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxis Net Login</title>

    <link rel="stylesheet" href="./css/taxis-net-login.css">
</head>
<body>
    <div>
        <header>
            <img class="img1" src="../img/tx1.png" alt="Γενική Γραμματεία Πληροφοριακών Συστημάτων και Ψηφιακής Διακυβέρνησης">

            <img class="img2" src="../img/tx2.png" alt="Ελληνική Δημοκρατία Υπουργείο Ψηφιακής Διακυβέρνησης">
        </header>

        <main>
            <section>
                <h1>Αυθεντικοποίηση Χρήστη</h1>

                <h2>Σύνδεση</h2>

                <p>Παρακαλώ εισάγετε τους κωδικούς σας στο <span>TaxisNet</span> για να συνδεθείτε.</p>
            </section>

            <section>
                <form>
                    <label for="fldUsername">Χρήστης:</label>
                    <input type="text" name="username" id="fldUsername">

                    <label for="fldPassword">Κωδικός:</label>
                    <input type="password" name="password" id="fldPassword">

                    <button>Σύνδεση</button>
                </form>
            </section>
        </main>

        <footer>
            <a href="#">Κέντρο Διαλειτουργικότητας (ΚΕ.Δ.) Υπουργείου Ψηφιακής Διακυβέρνησης</a>
        </footer>
    </div>
</body>
</html>
